name: CPPG canonical publication PostgreSQL

on:
  pull_request:
    paths:
      - ".github/workflows/cppg-canonical-registration-postgres.yml"
      - "db/cppg-runtime-postgres-registration.ts"
      - "db/runtime-authority-postgres-persistence.ts"
      - "db/postgres/migrations/0054_cppg_canonical_registration.sql"
      - "db/postgres/migrations/0055_cppg_publication_receipts.sql"
      - "db/content-revision-repositories.ts"
      - "db/curriculum-repositories.ts"
      - "db/lesson-repositories.ts"
      - "db/phase3-repositories.ts"
      - "db/question-repositories.ts"
      - "db/repositories.ts"
      - "db/shared-content-repositories.ts"
      - "db/specialized-repositories.ts"
      - "db/practical-specialization-repositories.ts"
      - "db/specialized-repositories.ts"
      - "lib/services/cppg-generic-publication-guard.ts"
      - "lib/services/cppg-runtime-course-registration.ts"
      - "lib/services/cppg-runtime-publication.ts"
      - "lib/services/audit-service.ts"
      - "scripts/owned-postgres-container.mjs"
      - "tests/cppg-canonical-registration-postgres-disposable.test.ts"
      - "tests/cppg-atomic-publication-postgres-disposable.test.ts"
      - "tests/cppg-publication-gate-service.test.ts"
      - "tests/cppg-publication-receipt-schema.test.mjs"
      - "package.json"
      - "package-lock.json"
  push:
    branches:
      - "fix/cppg-canonical-postgres-registration"
    paths:
      - ".github/workflows/cppg-canonical-registration-postgres.yml"
      - "db/cppg-runtime-postgres-registration.ts"
      - "db/runtime-authority-postgres-persistence.ts"
      - "db/postgres/migrations/0054_cppg_canonical_registration.sql"
      - "db/postgres/migrations/0055_cppg_publication_receipts.sql"
      - "db/content-revision-repositories.ts"
      - "db/curriculum-repositories.ts"
      - "db/lesson-repositories.ts"
      - "db/phase3-repositories.ts"
      - "db/question-repositories.ts"
      - "db/repositories.ts"
      - "db/shared-content-repositories.ts"
      - "db/specialized-repositories.ts"
      - "db/practical-specialization-repositories.ts"
      - "db/specialized-repositories.ts"
      - "lib/services/cppg-generic-publication-guard.ts"
      - "lib/services/cppg-runtime-course-registration.ts"
      - "lib/services/cppg-runtime-publication.ts"
      - "lib/services/audit-service.ts"
      - "scripts/owned-postgres-container.mjs"
      - "tests/cppg-canonical-registration-postgres-disposable.test.ts"
      - "tests/cppg-atomic-publication-postgres-disposable.test.ts"
      - "tests/cppg-publication-gate-service.test.ts"
      - "tests/cppg-publication-receipt-schema.test.mjs"
      - "package.json"
      - "package-lock.json"

permissions:
  contents: read

concurrency:
  group: cppg-canonical-registration-postgres-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  NODE_OPTIONS: "--experimental-strip-types"

jobs:
  postgres-registration:
    name: Exact-head disposable PostgreSQL registration and publication
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out exact source SHA
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify checked out SHA
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22.13.0"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Apply registration and publication migrations; verify PostgreSQL contract
        run: npm run test:cppg-registration:postgres && npm run test:cppg-publication:postgres

      - name: Verify source SHA after test
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
