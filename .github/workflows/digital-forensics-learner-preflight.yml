name: Digital Forensics Learner Preflight

on:
  pull_request:
    paths:
      - ".github/workflows/digital-forensics-learner-preflight.yml"
      - "verification/forensics-learner-preflight/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/digital-forensics-learner-preflight.yml"
      - "verification/forensics-learner-preflight/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: digital-forensics-learner-preflight-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: ${{ matrix.os_label }} / Python ${{ matrix.python_version }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os_label: Windows
            runner: windows-latest
            python_version: "3.11"
          - os_label: Windows
            runner: windows-latest
            python_version: "3.14"
          - os_label: Linux
            runner: ubuntu-latest
            python_version: "3.11"
          - os_label: Linux
            runner: ubuntu-latest
            python_version: "3.14"

    steps:
      - name: Check out exact event revision
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python_version }}

      - name: Assert checkout and record runtime
        shell: python
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          MATRIX_OS: ${{ matrix.os_label }}
          MATRIX_PYTHON: ${{ matrix.python_version }}
        run: |
          import os
          import platform
          import subprocess
          import sys

          expected = os.environ["EXPECTED_SHA"]
          actual = subprocess.check_output(
              ["git", "rev-parse", "HEAD"], text=True
          ).strip()
          print(f"expected_checkout_sha={expected}")
          print(f"actual_checkout_sha={actual}")
          print(f"matrix_os={os.environ['MATRIX_OS']}")
          print(f"matrix_python={os.environ['MATRIX_PYTHON']}")
          print(f"runner_os={platform.system()}")
          print(f"python_version={platform.python_version()}")
          print(f"python_implementation={platform.python_implementation()}")
          print(f"python_executable={sys.executable}")
          raise SystemExit(0 if actual == expected else 1)

      - name: Run standalone preflight contract from external cwd
        env:
          MATRIX_OS: ${{ matrix.os_label }}
          MATRIX_PYTHON: ${{ matrix.python_version }}
        run: python -B verification/forensics-learner-preflight/ci_matrix_check.py
