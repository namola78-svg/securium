name: Question attempt Evidence executor

on:
  pull_request:
    paths:
      - ".github/workflows/question-attempt-evidence-executor.yml"
      - "db/**"
      - "drizzle/**"
      - "lib/services/**"
      - "lib/errors.ts"
      - "tests/question-attempt-evidence-event-executor.test.mjs"
      - "tests/question-attempt-evidence-event-executor-postgres-disposable.test.mjs"
      - "tests/question-attempt-evidence-worker-once.test.mjs"
      - "tests/question-attempt-evidence-worker-once-postgres-disposable.test.mjs"
      - "tests/question-attempt-evidence-recompute-integration.test.mjs"
      - "tests/support/**"
      - "scripts/run-question-attempt-evidence-once.mjs"
      - "scripts/owned-postgres-container.mjs"
      - "scripts/cleanup-owned-postgres-container.mjs"
      - "scripts/run-d1-test-suite.mjs"
      - "docs/question-attempt-evidence-worker-once.md"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "vite.config.ts"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/question-attempt-evidence-executor.yml"
      - "db/**"
      - "drizzle/**"
      - "lib/services/**"
      - "lib/errors.ts"
      - "tests/question-attempt-evidence-event-executor.test.mjs"
      - "tests/question-attempt-evidence-event-executor-postgres-disposable.test.mjs"
      - "tests/question-attempt-evidence-worker-once.test.mjs"
      - "tests/question-attempt-evidence-worker-once-postgres-disposable.test.mjs"
      - "tests/question-attempt-evidence-recompute-integration.test.mjs"
      - "tests/support/**"
      - "scripts/run-question-attempt-evidence-once.mjs"
      - "scripts/owned-postgres-container.mjs"
      - "scripts/cleanup-owned-postgres-container.mjs"
      - "scripts/run-d1-test-suite.mjs"
      - "docs/question-attempt-evidence-worker-once.md"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "vite.config.ts"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: question-attempt-evidence-executor-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  APP_ENV: test
  NODE_OPTIONS: "--experimental-strip-types"

jobs:
  d1-executor:
    name: D1 QUESTION_ATTEMPT executor (19 tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out exact tested revision
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22.13.0"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Bind exact tested revision
        shell: bash
        run: |
          expected_sha="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$expected_sha"

      - name: Run disposable D1 executor tests
        shell: bash
        timeout-minutes: 10
        run: |
          set -o pipefail
          result_path="$RUNNER_TEMP/question-attempt-evidence-executor-d1.tap"
          node node_modules/tsx/dist/cli.mjs \
            --test \
            --test-concurrency=1 \
            --test-reporter=tap \
            tests/question-attempt-evidence-event-executor.test.mjs \
            | tee "$result_path"

          skipped="$(awk '/^# skipped / { print $3 }' "$result_path" | tail -n 1)"
          todo="$(awk '/^# todo / { print $3 }' "$result_path" | tail -n 1)"
          passed="$(awk '/^# pass / { print $3 }' "$result_path" | tail -n 1)"
          failed="$(awk '/^# fail / { print $3 }' "$result_path" | tail -n 1)"
          test "${skipped:-1}" = "0"
          test "${todo:-1}" = "0"
          test "${failed:-1}" = "0"
          test "${passed:-0}" = "9"

      - name: Run disposable D1 worker-once tests
        shell: bash
        timeout-minutes: 15
        run: |
          set -o pipefail
          result_path="$RUNNER_TEMP/question-attempt-evidence-worker-once-d1.tap"
          node node_modules/tsx/dist/cli.mjs \
            --test \
            --test-concurrency=1 \
            --test-reporter=tap \
            tests/question-attempt-evidence-worker-once.test.mjs \
            | tee "$result_path"

          skipped="$(awk '/^# skipped / { print $3 }' "$result_path" | tail -n 1)"
          todo="$(awk '/^# todo / { print $3 }' "$result_path" | tail -n 1)"
          passed="$(awk '/^# pass / { print $3 }' "$result_path" | tail -n 1)"
          failed="$(awk '/^# fail / { print $3 }' "$result_path" | tail -n 1)"
          test "${skipped:-1}" = "0"
          test "${todo:-1}" = "0"
          test "${failed:-1}" = "0"
          test "${passed:-0}" = "7"

      - name: Run HTTP producer to CLI D1 integration tests
        shell: bash
        timeout-minutes: 15
        run: |
          set -o pipefail
          result_path="$RUNNER_TEMP/question-attempt-evidence-recompute-integration-d1.tap"
          node node_modules/tsx/dist/cli.mjs \
            --test \
            --test-concurrency=1 \
            --test-reporter=tap \
            tests/question-attempt-evidence-recompute-integration.test.mjs \
            | tee "$result_path"

          skipped="$(awk '/^# skipped / { print $3 }' "$result_path" | tail -n 1)"
          todo="$(awk '/^# todo / { print $3 }' "$result_path" | tail -n 1)"
          passed="$(awk '/^# pass / { print $3 }' "$result_path" | tail -n 1)"
          failed="$(awk '/^# fail / { print $3 }' "$result_path" | tail -n 1)"
          test "${skipped:-1}" = "0"
          test "${todo:-1}" = "0"
          test "${failed:-1}" = "0"
          test "${passed:-0}" = "3"

  postgres-executor:
    name: PostgreSQL QUESTION_ATTEMPT executor (5 tests)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SECURIUM_EVIDENCE_EXECUTOR_PG_CONTAINER: securium-qae-executor-${{ github.run_id }}-${{ github.run_attempt }}
      SECURIUM_EVIDENCE_EXECUTOR_PG_OWNER: securium-qae-executor-owner-${{ github.run_id }}-${{ github.run_attempt }}
      SECURIUM_EVIDENCE_EXECUTOR_PG_RECEIPT: ${{ runner.temp }}/securium-qae-executor-${{ github.run_id }}-${{ github.run_attempt }}.json
      SECURIUM_EVIDENCE_ONCE_POSTGRES_CONTAINER: securium-qae-once-${{ github.run_id }}-${{ github.run_attempt }}
      SECURIUM_EVIDENCE_ONCE_POSTGRES_OWNER: securium-qae-once-owner-${{ github.run_id }}-${{ github.run_attempt }}
      SECURIUM_EVIDENCE_ONCE_POSTGRES_RECEIPT: ${{ runner.temp }}/securium-qae-once-${{ github.run_id }}-${{ github.run_attempt }}.json

    steps:
      - name: Check out exact tested revision
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22.13.0"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Bind exact tested revision
        shell: bash
        run: |
          expected_sha="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$expected_sha"

      - name: Run disposable PostgreSQL executor tests
        shell: bash
        timeout-minutes: 15
        run: |
          set -o pipefail
          result_path="$RUNNER_TEMP/question-attempt-evidence-executor-postgres.tap"
          node node_modules/tsx/dist/cli.mjs \
            --test \
            --test-concurrency=1 \
            --test-reporter=tap \
            tests/question-attempt-evidence-event-executor-postgres-disposable.test.mjs \
            | tee "$result_path"

          skipped="$(awk '/^# skipped / { print $3 }' "$result_path" | tail -n 1)"
          todo="$(awk '/^# todo / { print $3 }' "$result_path" | tail -n 1)"
          passed="$(awk '/^# pass / { print $3 }' "$result_path" | tail -n 1)"
          failed="$(awk '/^# fail / { print $3 }' "$result_path" | tail -n 1)"
          test "${skipped:-1}" = "0"
          test "${todo:-1}" = "0"
          test "${failed:-1}" = "0"
          test "${passed:-0}" = "3"

      - name: Run disposable PostgreSQL worker-once test
        shell: bash
        timeout-minutes: 15
        run: |
          set -o pipefail
          result_path="$RUNNER_TEMP/question-attempt-evidence-worker-once-postgres.tap"
          node node_modules/tsx/dist/cli.mjs \
            --test \
            --test-concurrency=1 \
            --test-reporter=tap \
            tests/question-attempt-evidence-worker-once-postgres-disposable.test.mjs \
            | tee "$result_path"

          skipped="$(awk '/^# skipped / { print $3 }' "$result_path" | tail -n 1)"
          todo="$(awk '/^# todo / { print $3 }' "$result_path" | tail -n 1)"
          passed="$(awk '/^# pass / { print $3 }' "$result_path" | tail -n 1)"
          failed="$(awk '/^# fail / { print $3 }' "$result_path" | tail -n 1)"
          test "${skipped:-1}" = "0"
          test "${todo:-1}" = "0"
          test "${failed:-1}" = "0"
          test "${passed:-0}" = "2"

      - name: Cleanup owned disposable PostgreSQL containers
        if: always()
        shell: bash
        run: |
          cleanup_failed=0
          for receipt_path in \
            "$SECURIUM_EVIDENCE_EXECUTOR_PG_RECEIPT" \
            "$SECURIUM_EVIDENCE_ONCE_POSTGRES_RECEIPT"; do
            if ! node scripts/cleanup-owned-postgres-container.mjs "--receipt=$receipt_path"; then
              cleanup_failed=1
            fi
          done
          exit "$cleanup_failed"
