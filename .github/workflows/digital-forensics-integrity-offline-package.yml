name: Digital Forensics Integrity Offline Package

on:
  pull_request:
    paths:
      - ".github/workflows/digital-forensics-integrity-offline-package.yml"
      - ".github/workflows/digital-forensics-integrity-local-lab.yml"
      - "content-drafts/digital-forensics-8h-foundation/**"
      - "examples/digital-forensics-integrity-local-lab/**"
      - "examples/digital-forensics-integrity-offline-package/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/digital-forensics-integrity-offline-package.yml"
      - ".github/workflows/digital-forensics-integrity-local-lab.yml"
      - "content-drafts/digital-forensics-8h-foundation/**"
      - "examples/digital-forensics-integrity-local-lab/**"
      - "examples/digital-forensics-integrity-offline-package/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: digital-forensics-integrity-offline-package-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: ${{ matrix.os_label }} / Python ${{ matrix.python_version }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os_label: Windows
            runner: windows-latest
            python_version: "3.11"
          - os_label: Windows
            runner: windows-latest
            python_version: "3.14"
          - os_label: Linux
            runner: ubuntu-latest
            python_version: "3.11"
          - os_label: Linux
            runner: ubuntu-latest
            python_version: "3.14"

    steps:
      - name: Check out exact event source revision
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Assert checked out revision
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: >-
          python -c "import os, subprocess; actual = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(); expected = os.environ['EXPECTED_SOURCE_SHA']; print(f'expected_source_sha={expected}'); print(f'actual_source_sha={actual}'); raise SystemExit(0 if actual == expected else 1)"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python_version }}

      - name: Create byte-preserved source worktree
        shell: python
        env:
          SECURIUM_OFFLINE_SOURCE_ROOT: ${{ runner.temp }}/securium-forensics-integrity-offline-source-${{ github.run_id }}-${{ matrix.os_label }}-${{ matrix.python_version }}
        run: |
          import os
          import subprocess
          from pathlib import Path

          source_root = Path(os.environ["SECURIUM_OFFLINE_SOURCE_ROOT"])
          subprocess.run(
              ["git", "worktree", "add", "--detach", "--no-checkout", str(source_root), "HEAD"],
              check=True,
          )
          subprocess.run(["git", "-C", str(source_root), "config", "core.autocrlf", "false"], check=True)
          subprocess.run(["git", "-C", str(source_root), "config", "core.eol", "lf"], check=True)
          subprocess.run(["git", "-C", str(source_root), "checkout", "--force", "HEAD"], check=True)
          status = subprocess.check_output(
              ["git", "-C", str(source_root), "status", "--porcelain", "--untracked-files=all"],
              text=True,
              encoding="utf-8",
              errors="replace",
          ).strip()
          print("source_worktree_status=" + ("clean" if not status else status))
          if status:
              raise SystemExit("byte-preserved source worktree is dirty")

      - name: Record runtime and run extracted-package matrix contract
        working-directory: ${{ runner.temp }}/securium-forensics-integrity-offline-source-${{ github.run_id }}-${{ matrix.os_label }}-${{ matrix.python_version }}
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          MATRIX_PYTHON: ${{ matrix.python_version }}
          SECURIUM_OFFLINE_CI_ROOT: ${{ runner.temp }}/securium-forensics-integrity-offline-${{ github.run_id }}-${{ matrix.os_label }}-${{ matrix.python_version }}
        run: python -B examples/digital-forensics-integrity-offline-package/ci_matrix_check.py

      - name: Remove CI-owned package workspaces
        if: always()
        shell: python
        env:
          SECURIUM_OFFLINE_CI_ROOT: ${{ runner.temp }}/securium-forensics-integrity-offline-${{ github.run_id }}-${{ matrix.os_label }}-${{ matrix.python_version }}
        run: |
          import os
          import shutil
          import stat
          from pathlib import Path

          root = Path(os.environ["SECURIUM_OFFLINE_CI_ROOT"])
          if not root.exists():
              print("ci_owned_workspace=absent")
          else:
              if root.is_symlink() or not root.is_dir():
                  raise SystemExit("refusing cleanup of a replaced CI root")
              reparse_flag = getattr(stat, "FILE_ATTRIBUTE_REPARSE_POINT", 0x400)
              try:
                  if root.stat(follow_symlinks=False).st_file_attributes & reparse_flag:
                      raise SystemExit("refusing cleanup of a reparse CI root")
              except AttributeError:
                  pass
              shutil.rmtree(root)
              print("ci_owned_workspace=removed")

      - name: Remove CI-owned source worktree
        if: always()
        shell: python
        env:
          SECURIUM_OFFLINE_SOURCE_ROOT: ${{ runner.temp }}/securium-forensics-integrity-offline-source-${{ github.run_id }}-${{ matrix.os_label }}-${{ matrix.python_version }}
        run: |
          import os
          import stat
          import subprocess
          from pathlib import Path

          source_root = Path(os.environ["SECURIUM_OFFLINE_SOURCE_ROOT"])
          if not source_root.exists():
              print("ci_owned_source_worktree=absent")
          else:
              if source_root.is_symlink() or not source_root.is_dir():
                  raise SystemExit("refusing cleanup of a replaced source worktree")
              reparse_flag = getattr(stat, "FILE_ATTRIBUTE_REPARSE_POINT", 0x400)
              try:
                  if source_root.stat(follow_symlinks=False).st_file_attributes & reparse_flag:
                      raise SystemExit("refusing cleanup of a reparse source worktree")
              except AttributeError:
                  pass
              listed = subprocess.check_output(
                  ["git", "worktree", "list", "--porcelain"],
                  text=True,
                  encoding="utf-8",
                  errors="replace",
              )
              registered = {
                  Path(line.removeprefix("worktree ")).resolve()
                  for line in listed.splitlines()
                  if line.startswith("worktree ")
              }
              if source_root.resolve() not in registered:
                  raise SystemExit("refusing cleanup of an unregistered source worktree")
              subprocess.run(["git", "worktree", "remove", "--force", str(source_root)], check=True)
              print("ci_owned_source_worktree=removed")

      - name: Remove generated Python caches
        if: always()
        shell: python
        run: |
          import shutil
          from pathlib import Path

          roots = (
              Path("examples/digital-forensics-integrity-local-lab"),
              Path("examples/digital-forensics-integrity-offline-package"),
          )
          caches = sorted(
              {
                  path
                  for root in roots
                  for path in root.rglob("__pycache__")
                  if path.is_dir()
              },
              key=lambda path: len(path.parts),
              reverse=True,
          )
          for cache in caches:
              shutil.rmtree(cache)
          print(f"removed_python_cache_directories={len(caches)}")
