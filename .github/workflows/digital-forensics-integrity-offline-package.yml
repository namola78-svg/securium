name: Digital Forensics Integrity Offline Package

on:
  pull_request:
    paths:
      - ".github/workflows/digital-forensics-integrity-offline-package.yml"
      - ".github/workflows/digital-forensics-integrity-local-lab.yml"
      - "content-drafts/digital-forensics-8h-foundation/**"
      - "examples/digital-forensics-integrity-local-lab/**"
      - "examples/digital-forensics-integrity-offline-package/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/digital-forensics-integrity-offline-package.yml"
      - ".github/workflows/digital-forensics-integrity-local-lab.yml"
      - "content-drafts/digital-forensics-8h-foundation/**"
      - "examples/digital-forensics-integrity-local-lab/**"
      - "examples/digital-forensics-integrity-offline-package/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: digital-forensics-integrity-offline-package-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: ${{ matrix.os_label }} / Python ${{ matrix.python_version }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os_label: Windows
            runner: windows-latest
            python_version: "3.11"
          - os_label: Windows
            runner: windows-latest
            python_version: "3.14"
          - os_label: Linux
            runner: ubuntu-latest
            python_version: "3.11"
          - os_label: Linux
            runner: ubuntu-latest
            python_version: "3.14"

    steps:
      - name: Check out exact event source revision
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Assert checked out revision
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: >-
          python -c "import os, subprocess; actual = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(); expected = os.environ['EXPECTED_SOURCE_SHA']; print(f'expected_source_sha={expected}'); print(f'actual_source_sha={actual}'); raise SystemExit(0 if actual == expected else 1)"

      - name: Configure byte-preserving checkout
        shell: python
        run: |
          import subprocess

          subprocess.run(["git", "config", "core.autocrlf", "false"], check=True)
          subprocess.run(["git", "config", "core.eol", "lf"], check=True)

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python_version }}

      - name: Preserve committed source bytes
        shell: python
        run: |
          import subprocess
          from pathlib import Path

          prefixes = (
              ".github/workflows/digital-forensics-integrity-offline-package.yml",
              ".github/workflows/digital-forensics-integrity-local-lab.yml",
              "content-drafts/digital-forensics-8h-foundation",
              "examples/digital-forensics-integrity-local-lab",
              "examples/digital-forensics-integrity-offline-package",
          )
          tracked = subprocess.check_output(
              ["git", "ls-files", "-z", "--", *prefixes]
          ).split(b"\0")
          for raw_path in tracked:
              if not raw_path:
                  continue
              relative = raw_path.decode("utf-8")
              data = subprocess.check_output(
                  ["git", "cat-file", "blob", f"HEAD:{relative}"]
              )
              target = Path(relative)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(data)

      - name: Record runtime and run extracted-package matrix contract
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          MATRIX_PYTHON: ${{ matrix.python_version }}
          SECURIUM_OFFLINE_CI_ROOT: ${{ runner.temp }}/securium-forensics-integrity-offline-${{ github.run_id }}-${{ matrix.os_label }}-${{ matrix.python_version }}
        run: python -B examples/digital-forensics-integrity-offline-package/ci_matrix_check.py

      - name: Remove CI-owned package workspaces
        if: always()
        shell: python
        env:
          SECURIUM_OFFLINE_CI_ROOT: ${{ runner.temp }}/securium-forensics-integrity-offline-${{ github.run_id }}-${{ matrix.os_label }}-${{ matrix.python_version }}
        run: |
          import os
          import shutil
          import stat
          from pathlib import Path

          root = Path(os.environ["SECURIUM_OFFLINE_CI_ROOT"])
          if not root.exists():
              print("ci_owned_workspace=absent")
          else:
              if root.is_symlink() or not root.is_dir():
                  raise SystemExit("refusing cleanup of a replaced CI root")
              reparse_flag = getattr(stat, "FILE_ATTRIBUTE_REPARSE_POINT", 0x400)
              try:
                  if root.stat(follow_symlinks=False).st_file_attributes & reparse_flag:
                      raise SystemExit("refusing cleanup of a reparse CI root")
              except AttributeError:
                  pass
              shutil.rmtree(root)
              print("ci_owned_workspace=removed")

      - name: Remove generated Python caches
        if: always()
        shell: python
        run: |
          import shutil
          from pathlib import Path

          roots = (
              Path("examples/digital-forensics-integrity-local-lab"),
              Path("examples/digital-forensics-integrity-offline-package"),
          )
          caches = sorted(
              {
                  path
                  for root in roots
                  for path in root.rglob("__pycache__")
                  if path.is_dir()
              },
              key=lambda path: len(path.parts),
              reverse=True,
          )
          for cache in caches:
              shutil.rmtree(cache)
          print(f"removed_python_cache_directories={len(caches)}")
